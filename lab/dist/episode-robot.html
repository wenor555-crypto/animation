<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab · T-800 model sheet · Η Έξυπνη Σίτα</title>
<style>
:root { --bg:#f4efe4; --panel:#fffaf0; --ink:#231a2e; --muted:#6b5f76; --accent:#d8453a; --btn:#231a2e; --btn-ink:#fffaf0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#16111d; --panel:#221a2c; --ink:#f4efe4; --muted:#a99cb6; --accent:#ff6a5c; --btn:#f4efe4; --btn-ink:#16111d; }
}
:root[data-theme="dark"] { --bg:#16111d; --panel:#221a2c; --ink:#f4efe4; --muted:#a99cb6; --accent:#ff6a5c; --btn:#f4efe4; --btn-ink:#16111d; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Comfortaa, system-ui, sans-serif; }
main { max-width:1120px; margin:0 auto; padding:20px 16px 40px; }
h1 { font:italic 900 clamp(24px,4.5vw,40px) "Noto Sans", sans-serif; margin:0; }
header p { margin:4px 0 16px; color:var(--muted); font-size:14px; }
.stage { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:14px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.25); }
canvas { display:block; width:100%; height:100%; }
#big { position:absolute; inset:0; margin:auto; width:96px; height:96px; border-radius:50%; border:5px solid #231a2e; background:#ffd23f; color:#231a2e; font-size:40px; cursor:pointer; box-shadow:0 6px 0 #231a2e; }
#big[hidden] { display:none; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; background:var(--panel); padding:10px; border-radius:12px; }
.bar button { font:inherit; font-size:14px; border:0; border-radius:8px; padding:8px 12px; background:var(--btn); color:var(--btn-ink); cursor:pointer; min-width:44px; }
.bar input[type=range] { flex:1 1 200px; accent-color:var(--accent); min-width:0; }
#time { font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); min-width:84px; text-align:right; }
#note { font-size:12px; color:var(--muted); margin-top:8px; }
.stage:fullscreen { border-radius:0; }
.bar select { font:inherit; font-size:13px; border:0; border-radius:8px; padding:8px; background:var(--btn); color:var(--btn-ink); max-width:180px; }

</style>
</head>
<body>
<main>
  <header><h1>Lab · T-800</h1><p>Model sheet · turntable · poses · walk · assembly</p></header>
  <div class="stage" id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <button id="big" aria-label="Play">▶</button>
  </div>
  <div class="bar">
    <button id="play">▶ Play</button>
    <button id="restart" title="Restart">⟲</button>
    <input type="range" id="scrub" min="0" max="1200" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00</span>
    <select id="chap" aria-label="Scene"></select>
    <button id="vo" title="Voices">🗣</button>
    <button id="lang" title="Subtitle language">EN</button>
    <button id="snd" title="Sound">🔊</button>
    <button id="fs" title="Fullscreen">⛶</button>
  </div>
</main>
<script>window.CLIP_DUR = {};</script>
<script>
/* =========================================================
   «Η Έξυπνη Σίτα» – shared engine
   Canvas primitives with line boil, synth audio, placeholder
   narrator/voices (speechSynthesis), subtitles and the player.
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720, TAU = Math.PI * 2, INK = '#241d22';
const TVFONT = '"Noto Sans", sans-serif';
/* clean look: the scenes draw in 1280×720 units, the canvas renders them at RES× (1920×1080) for crisp lines,
   and CLEAN turns off the hand-drawn wobble and the 8 fps line boil (smooth ellipses, straight edges). */
const RES = 1.5, CLEAN = true, OUTLINE = .8;   // OUTLINE: thinner ink around filled shapes
cv.width = W * RES; cv.height = H * RES;
{ const st = ctx.setTransform.bind(ctx); ctx.setTransform = (a, b, c, d, e, f) => st(a * RES, b * RES, c * RES, d * RES, e * RES, f * RES); }
ctx.setTransform(1, 0, 0, 1, 0, 0);

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const back = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const bump = (t, a, b) => Math.sin(prog(t, a, b) * Math.PI);          // 0→1→0 over [a,b]
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

/* ---------- wobbly primitives (line boil at 8fps) ---------- */
let SEED = 0, BOIL = 0;
const jit = (sd, i, k) => CLEAN ? 0 : (hash(sd * 12.9898 + i * 78.233 + BOIL * 37.719 + k * 3.3) - .5) * 2;
/* outlines keep (roughly) the same on-screen weight when the camera pushes in, instead of getting fat in close-ups */
function zoomComp() { if (!CLEAN) return 1; const m = ctx.getTransform(), z = Math.hypot(m.a, m.b) / RES; return z > 1 ? Math.pow(z, -.6) : 1; }
function finish(fill, o) {
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = (o.gb || 20) * RES; }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (o.lw !== 0) { ctx.lineWidth = (o.lw || 4) * (CLEAN && fill ? OUTLINE * zoomComp() : 1); ctx.strokeStyle = o.sc || INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
  ctx.restore();
}
function blob(x, y, rx, ry, fill, o = {}) {
  const sd = ++SEED, n = o.n || 24, w = o.w ?? 1.2, rot = o.rot || 0, cr = Math.cos(rot), sr = Math.sin(rot);
  ctx.beginPath();
  if (CLEAN) { ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); finish(fill, o); return; }
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, j = jit(sd, i, 0) * w, px = Math.cos(a) * (rx + j), py = Math.sin(a) * (ry + j);
    const X = x + px * cr - py * sr, Y = y + px * sr + py * cr; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.closePath(); finish(fill, o);
}
const wp = (pts, sd, w) => pts.map((p, i) => [p[0] + jit(sd, i, 1) * w, p[1] + jit(sd, i, 2) * w]);
function poly(pts, fill, o = {}) {
  const sd = ++SEED, P = wp(pts, sd, o.w ?? 1), L = P.length;
  ctx.beginPath();
  if (o.smooth) {
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = m(P[L - 1], P[0]); ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < L; i++) { const mm = m(P[i], P[(i + 1) % L]); ctx.quadraticCurveTo(P[i][0], P[i][1], mm[0], mm[1]); }
  } else P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath(); finish(fill, o);
}
function curve(pts, lw = 4, col = INK, o = {}) {
  const sd = ++SEED, P = wp(pts, sd, o.w ?? .9), L = P.length;
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  if (L === 2) ctx.lineTo(P[1][0], P[1][1]);
  else for (let i = 1; i < L - 1; i++) { const e = i === L - 2; ctx.quadraticCurveTo(P[i][0], P[i][1], e ? P[i + 1][0] : (P[i][0] + P[i + 1][0]) / 2, e ? P[i + 1][1] : (P[i][1] + P[i + 1][1]) / 2); }
  finish(null, { ...o, lw, sc: col });
}
function limb(pts, lw, col, o = {}) { curve(pts, lw + 6 * OUTLINE * zoomComp(), INK, o); SEED--; curve(pts, lw, col, o); }
function rect(x, y, w, h, fill, o = {}) { poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, o); }
function txt(s, x, y, size, col, o = {}) {
  ctx.font = `${o.style || ''} ${o.weight || 700} ${size}px ${o.font || 'Comfortaa, sans-serif'}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc || INK; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function eye(x, y, r, lx, ly, bl, o = {}) {        // big whites, tiny dot pupils
  if (bl) { curve([[x - r, y + 1], [x, y + r * .35], [x + r, y + 1]], 3); SEED++; return; }
  blob(x, y, r, r * (o.sq || 1.08), '#fff', { lw: 3, w: .5 });
  blob(x + lx * r * .45, y + ly * r * .45, o.pr || 2.8, o.pr || 2.8, INK, { lw: 0, w: .15, n: 10 });
  if (o.lid) curve([[x - r, y - r * .2], [x + r, y - r * .2]], 3);      // half-lidded, bored
}
const blinkAt = (t, off) => ((t + off) % 3.7) < .12;
function mosquito(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalAlpha *= .5; blob(0, -4 + Math.sin(t * 90) * 2, 4, 2, '#dfe9f2', { lw: 0 }); ctx.globalAlpha /= .5;
  blob(0, 0, 4, 1.6, '#3b302c', { lw: 0 }); curve([[-2, 1], [-4, 5]], 1, INK, { w: 0 }); curve([[2, 1], [4, 5]], 1, INK, { w: 0 });
  ctx.restore();
}

/* =========================================================
   AUDIO: synth SFX + ambience
   ========================================================= */
let AC = null, master = null, voiceBus = null, amb = null, soundOn = true, voOn = true, playing = false;
let AT = null;       // when set, sounds are scheduled at this time instead of "now" (offline export)
const audioNow = () => AT ?? AC.currentTime;
function ensureAudio() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); buildAudio(); }
  if (AC.state === 'suspended') AC.resume();
  queueClips();
}
function buildAudio() {
  {
    master = AC.createGain(); master.connect(AC.destination);
    // the dialogue bus: every clip is levelled (window.CLIP_GAIN, dB, from tools/level_voices.py) and goes through a
    // fast peak limiter, so a quiet voice brought up to the others' loudness doesn't clip on its transients
    voiceBus = AC.createDynamicsCompressor();
    voiceBus.threshold.value = -3; voiceBus.knee.value = 0; voiceBus.ratio.value = 20; voiceBus.attack.value = .001; voiceBus.release.value = .08;
    voiceBus.connect(master);
    const osc = (type, f) => { const o = AC.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; };
    const gain = v => { const g = AC.createGain(); g.gain.value = v; return g; };
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true; ns.start();
    const cf = AC.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 5200; cf.Q.value = 6;
    const cAM = gain(0), lfo = osc('square', 34), lg = gain(.5); lfo.connect(lg); lg.connect(cAM.gain);
    const cG = gain(0); ns.connect(cf); cf.connect(cAM); cAM.connect(cG); cG.connect(master);
    const mq = osc('sawtooth', 560), vib = osc('sine', 7), vg = gain(18); vib.connect(vg); vg.connect(mq.frequency);
    const mf = AC.createBiquadFilter(); mf.type = 'bandpass'; mf.frequency.value = 900; mf.Q.value = 1.2;
    const mG = gain(0); mq.connect(mf); mf.connect(mG); mG.connect(master);
    // crickets: band-passed noise with a fast trill, fading in and out smoothly (no pure tones, so it never beeps)
    const kn = AC.createBufferSource(); kn.buffer = nb; kn.loop = true; kn.start();
    const kf = AC.createBiquadFilter(); kf.type = 'bandpass'; kf.frequency.value = 4600; kf.Q.value = 14;
    const kTr = gain(0), tr = osc('sine', 23), trG = gain(.5); tr.connect(trG); trG.connect(kTr.gain);
    const kGate = gain(.5), gl = osc('sine', .37), glG = gain(.5); gl.connect(glG); glG.connect(kGate.gain);
    const krG = gain(0); kn.connect(kf); kf.connect(kTr); kTr.connect(kGate); kGate.connect(krG); krG.connect(master);
    // mains hum (evil devices)
    const hm = osc('sawtooth', 50), hf = AC.createBiquadFilter(); hf.type = 'lowpass'; hf.frequency.value = 180;
    const hG = gain(0); hm.connect(hf); hf.connect(hG); hG.connect(master);
    amb = { cG, mG, krG, hG };
  }
}
/* the ambience levels for scene time lt (same mix as live playback) */
function setAmbience(a, n, on = true) {
  amb.cG.gain.setTargetAtTime(on ? a.cicada || 0 : 0, n, .08); amb.mG.gain.setTargetAtTime(on ? (a.mosq || 0) * .5 : 0, n, .08);
  amb.krG.gain.setTargetAtTime(on ? (a.cricket || 0) * 2.5 : 0, n, .08); amb.hG.gain.setTargetAtTime(on ? (a.hum || 0) * .4 : 0, n, .08);
}
function tone(f, dur, type = 'triangle', vol = .06, slide = 0, delay = 0) {
  if (!soundOn || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = audioNow() + delay;
  o.type = type; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), n + dur);
  g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(vol, n + .008); g.gain.exponentialRampToValueAtTime(.0001, n + dur);
  o.connect(g); g.connect(master); o.start(n); o.stop(n + dur + .02);
}
function noise(dur, vol = .2, freq = 800, q = .7, type = 'lowpass', delay = 0) {
  if (!soundOn || !AC) return;
  const n = audioNow() + delay, len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(n);
}
const SFX = {
  slap: () => { noise(.09, .5, 2400, .8, 'bandpass'); tone(180, .06, 'sine', .08, .5); },
  sip: () => noise(.7, .12, 1400, 3, 'bandpass'),
  creak: () => { tone(320, .5, 'sawtooth', .025, 1.6); tone(410, .4, 'sawtooth', .02, 1.4, .1); },
  slam: () => { noise(.35, .6, 500); tone(70, .3, 'sine', .25, .5); },
  crash: () => { noise(.5, .25, 4000, .5, 'highpass', .25); for (let i = 0; i < 6; i++) tone(2000 + Math.random() * 3000, .15, 'sine', .04, 1, .25 + i * .05); },
  door: () => { noise(.25, .5, 700); tone(90, .25, 'sine', .2, .6); },
  choir: () => [0, 4, 7, 12].forEach(s => { tone(261.6 * 2 ** (s / 12), 2.2, 'sine', .05); tone(261.6 * 2 ** (s / 12) * 1.005, 2.2, 'triangle', .025); }),
  flies: () => { tone(200, 1.6, 'sawtooth', .025, 1.1); tone(230, 1.6, 'sawtooth', .02, .95); },
  clack: () => { tone(2400, .05, 'square', .1, .4); tone(900, .08, 'square', .08, .5); },
  clacks: (n = 3) => { for (let i = 0; i < n; i++) { tone(2400, .05, 'square', .08, .4, i * .13); tone(900, .07, 'square', .06, .5, i * .13); } },
  jingle: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(523.25 * 2 ** (s / 12), .25, 'square', .045, 0, i * .09)),
  jingleMinor: () => [0, 3, 7, 12, 15].forEach((s, i) => tone(261.6 * 2 ** (s / 12), .5, 'square', .04, 0, i * .22)),
  ding: () => { tone(1568, .5, 'sine', .08); tone(2093, .6, 'sine', .05, 0, .08); },
  whoosh: () => noise(.5, .35, 900, .6, 'bandpass'),
  fire: () => { noise(1.2, .4, 600); noise(1.2, .2, 2000, .5, 'bandpass', .1); },
  spark: () => { noise(.12, .3, 5000, 1, 'highpass'); tone(3000, .08, 'square', .04, .3); },
  laser: () => { tone(3200, .09, 'square', .035, .35); tone(1600, .14, 'sine', .05, .5, .03); noise(.1, .18, 4500, 1, 'highpass', .06); },   // «τσσπ»
  zap: () => { for (let i = 0; i < 5; i++) { noise(.05, .3, 6000, 1, 'highpass', i * .06); tone(180, .05, 'sawtooth', .06, 1, i * .06); } },
  buzz: (d = .8) => { tone(110, d, 'sawtooth', .05, 1.02); tone(113, d, 'square', .03, .98); },
  boot: () => [0, 7, 12, 16].forEach((s, i) => tone(392 * 2 ** (s / 12), .7, 'sine', .06, 0, i * .18)),
  drums: () => { for (let i = 0; i < 12; i++) { noise(.12, .3 + i * .03, 300, 1, 'lowpass', i * .08); tone(90, .1, 'sine', .15, .6, i * .08); } },
  applause: () => { for (let i = 0; i < 40; i++) noise(.05, .12, 2500, .8, 'bandpass', Math.random() * 1.6); },
  boom: () => { noise(1, .7, 300); tone(55, .9, 'sine', .35, .4); },
  thud: () => { noise(.2, .5, 250); tone(80, .2, 'sine', .25, .5); },
  pop: () => tone(600, .08, 'sine', .08, 2),
  cluck: () => { for (let i = 0; i < 3; i++) tone(700 + Math.random() * 300, .06, 'square', .04, .7, i * .1); },
  snore: () => { noise(1, .12, 300, 2, 'bandpass'); tone(80, 1, 'sawtooth', .02, 1.2); },
  engine: () => { tone(60, 1.6, 'sawtooth', .07, 1.8); noise(1.6, .15, 400); },
  honk: () => { tone(415, .4, 'square', .06); tone(523, .4, 'square', .05); },
  phone: () => { for (let i = 0; i < 2; i++) { tone(1200, .12, 'square', .04, 1, i * .2); tone(900, .12, 'square', .04, 1, i * .2 + .1); } },
  splash: () => noise(.5, .35, 1200, .5, 'bandpass'),
  hiss: () => noise(.9, .3, 3000, .4, 'highpass'),
  rev: () => { tone(70, 1.2, 'sawtooth', .08, 4); noise(1.2, .2, 800); },
  swell: () => [0, 7, 12].forEach(s => tone(110 * 2 ** (s / 12), 2.5, 'sawtooth', .03, 1.01)),
  gong: () => { tone(98, 3, 'sine', .2, .98); tone(147, 3, 'sine', .08, .99); noise(.4, .3, 400) },
  windows: () => [[622, 0], [932, .15], [831, .3], [1244, .45]].forEach(([f, d]) => tone(f, .9, 'sine', .06, 1, d)),
  fanfare: () => [0, 4, 7, 12, 7, 12].forEach((s, i) => tone(392 * 2 ** (s / 12), .3, 'sawtooth', .04, 0, i * .14)),
};

/* =========================================================
   VOICES: recorded clips (Web Audio) or placeholder TTS/babble
   ========================================================= */
let greekVoice = null;
const loadVoices = () => { greekVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('el')) || null; };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
/* Clips come from window.CLIPS (embedded by build.py from audio/<scene>/<NN>.mp3) and are decoded
   into Web Audio buffers: <audio> elements with data: URLs get blocked by autoplay rules and
   sandboxed previews. Only the scenes around the playhead are kept decoded (memory).
   While a voice is speaking the timeline HOLDS at the end of that line. */
const BUFS = {}, DECODED_SCENES = new Set();
let speaking = false, speakStart = 0, speakMax = 6, curClip = null, pendingKey = null;
function decodeScene(id) {
  if (!AC || DECODED_SCENES.has(id)) return;
  DECODED_SCENES.add(id);
  for (const [key, src] of Object.entries(window.CLIPS || {})) {
    if (!key.startsWith(id + '/') || key in BUFS) continue;
    BUFS[key] = null;
    const bin = atob(src.slice(src.indexOf(',') + 1)), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    AC.decodeAudioData(bytes.buffer).then(b => {
      if (!DECODED_SCENES.has(id)) { delete BUFS[key]; return; }
      BUFS[key] = b; if (pendingKey === key) startClip(key);
    }, e => { console.warn('clip decode failed', key, e); delete BUFS[key]; if (pendingKey === key) { pendingKey = null; speaking = false; } });
  }
}
function queueClips() {
  if (!AC || !EP) return;
  const i = EP.cur, keep = new Set([i - 1, i, i + 1, i + 2].filter(k => k >= 0 && k < EP.scenes.length).map(k => EP.scenes[k].id));
  for (const id of [...DECODED_SCENES]) if (!keep.has(id)) { DECODED_SCENES.delete(id); for (const k in BUFS) if (k.startsWith(id + '/')) delete BUFS[k]; }
  for (const id of keep) decodeScene(id);
}
const clipKey = (sc, idx) => `${sc.id}/${String(idx + 1).padStart(2, '0')}`;
function clipOut(key) {   // the clip's own level into the dialogue bus
  const g = AC.createGain(); g.gain.value = Math.pow(10, ((window.CLIP_GAIN || {})[key] || 0) / 20); g.connect(voiceBus || master); return g;
}
function startClip(key) {
  pendingKey = null;
  curClip = AC.createBufferSource(); curClip.buffer = BUFS[key]; curClip.connect(clipOut(key));
  curClip.onended = () => { speaking = false; };
  speaking = true; speakStart = performance.now(); speakMax = BUFS[key].duration + 1.5; curClip.start();

/* =========================================================

   A small pseudo-3D renderer for machines: a real skeleton (bones with local rotations), and parts bound to the
   bones (boxes, cylinders, spheres, pistons, cables) drawn with cel shading and ink. The same code draws every view
   (front, 3/4, profile, back) and every pose, so a model sheet and the animation can never disagree.
   Orthographic projection, painter's sort by depth. Everything is a pure function of its inputs (no state): the
   frame QA's NONDET check stays clean.

const R3 = (() => {
  /* ---------- 3×3 matrices (row-major) ---------- */
  const I = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  const rx = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const ry = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const rz = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };

    A[6] * B[0] + A[7] * B[3] + A[8] * B[6], A[6] * B[1] + A[7] * B[4] + A[8] * B[7], A[6] * B[2] + A[7] * B[5] + A[8] * B[8]];

  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  /* model.bones: [{ name, parent, at: [x,y,z] (joint position in the parent's frame at rest) }], parents first */
  function solve(model, pose = {}, opt = {}) {

      const R = mm(P.R, euler(pose[b.name]));

      V, s,
      proj: p => { const q = mv(V, p); return [X + q[0] * s, Y - q[1] * s, q[2]]; },
      dir: v => mv(V, v),

  /* ---------- geometry of the parts ---------- */
  const BOX_FACES = [   // [normal, U axis, V axis (V points DOWN on the face as drawn), name]
    [[0, 0, 1], [1, 0, 0], [0, -1, 0], 'front'], [[0, 0, -1], [-1, 0, 0], [0, -1, 0], 'back'],
    [[1, 0, 0], [0, 0, -1], [0, -1, 0], 'right'], [[-1, 0, 0], [0, 0, 1], [0, -1, 0], 'left'],

  /* a decal or detail drawn in the plane of a face: (u, v) in part units from the face centre, v down */
  function onFace(view, c, U, Vd, draw) {
    const o = view.proj(c), pu = view.proj(add(c, U)), pv = view.proj(add(c, Vd));
    ctx.save(); ctx.transform(pu[0] - o[0], pu[1] - o[1], pv[0] - o[0], pv[1] - o[1], o[0], o[1]); draw(); ctx.restore();
  }

  function emitBox(list, view, part, pl, o) {

        fillFace(corners, faceShade(nv, mat, o), o, true, part.lw || 2.4);
        const rk = rimK(nv, o); if (rk) { ctx.save(); ctx.globalAlpha = rk; ctx.globalCompositeOperation = 'screen'; quadPath(corners); ctx.fillStyle = o.rim.col; ctx.fill(); ctx.restore(); }

          ctx.save(); quadPath(corners); ctx.clip(); onFace(view, cw, mv(pl.R, u), mv(pl.R, v), () => {
            ctx.globalAlpha = .28 * mat.spec; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-half[0] * .2, -half[1] * 1.2); ctx.lineTo(half[0] * .25, -half[1] * 1.2); ctx.lineTo(-half[0] * .25, half[1] * 1.2); ctx.lineTo(-half[0] * .7, half[1] * 1.2); ctx.closePath(); ctx.fill(); }); ctx.restore();

  /* a cylinder along its local y axis: faceted sides without inner ink, ink on the caps and on the silhouette edges */
  function emitCyl(list, view, part, pl, o) {
    const r = part.r, h = part.h, n = part.n || 18, mat = part.mat;
    const ax = mv(pl.R, [0, 1, 0]), top = add(pl.c, scl(ax, h / 2)), bot = add(pl.c, scl(ax, -h / 2));

        for (let i = 0; i <= n; i++) { const k = i % n; if (!vis[k] && !vis[(k + n - 1) % n]) { started = false; continue; } const p = view.proj(add(add(pl.c, scl(ax, y0)), ring[k])); started ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); started = true; }

      const nv = view.dir(scl(ax, sgn));

      list.push({ z: view.proj(cc)[2] + (part.zBias || 0) + .01, draw: () => {
        fillFace(pts, faceShade(nv, mat, o), o, true, part.lw || 2.4);
        const dec = part.decals && part.decals[name];

    const p = view.proj(pl.c), r = part.r * view.s, T = tones(part.mat.col);
    list.push({ z: p[2] + (part.zBias || 0), draw: () => {
      ctx.save();

      ctx.clip();
      ctx.beginPath(); ctx.arc(p[0] + r * .45, p[1] + r * .5, r * 1.05, 0, TAU); ctx.fillStyle = T[2]; ctx.fill();
      ctx.beginPath(); ctx.arc(p[0] - r * .32, p[1] - r * .36, r * .42, 0, TAU); ctx.fillStyle = T[0]; ctx.fill();

      ctx.restore();
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.lineWidth = (part.lw || 2.4) * (o.inkScale ?? 1); ctx.strokeStyle = o.ink || INK; ctx.stroke();
    } });
  }

  /* a hydraulic piston between two bone-space points: dark sleeve + chrome rod */
  function emitPiston(list, view, part, W, o) {
    const A = add(W[part.a[0]].p, mv(W[part.a[0]].R, part.a[1])), B = add(W[part.b[0]].p, mv(W[part.b[0]].R, part.b[1]));
    const pa = view.proj(A), pb = view.proj(B), m = [lerp(pa[0], pb[0], .55), lerp(pa[1], pb[1], .55)];

      ctx.save(); ctx.lineCap = 'round';

      seg(m, pb, w * .55, '#d7dde6'); seg(pa, m, w, '#3a3f49');
      ctx.restore();
    } });
  }

  /* a cable: a sagging curve between two bone-space points */
  function emitCable(list, view, part, W, o) {
    const A = add(W[part.a[0]].p, mv(W[part.a[0]].R, part.a[1])), B = add(W[part.b[0]].p, mv(W[part.b[0]].R, part.b[1]));

      ctx.save(); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(pa[0], pa[1]);
      ctx.quadraticCurveTo((pa[0] + pb[0]) / 2 + sway, (pa[1] + pb[1]) / 2 + sag, pb[0], pb[1]);
      ctx.lineWidth = (part.w || 5) * view.s + 3.6; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = (part.w || 5) * view.s; ctx.strokeStyle = part.col || '#2d2f36'; ctx.stroke(); ctx.restore();
    } });
  }

  /* ---------- draw a model ----------
     o: { x, y, s, yaw, pitch, t, pose, asm: { partId: { k, from, spin } }, hide: Set, rim, ink, ground (screen y) } */
  function draw(model, o = {}) {
    const W = solve(model, o.pose || {}, o), view = viewOf(o), list = [];
    for (const part of model.parts) {
      if (o.hide && o.hide.has(part.id)) continue;

      if (asm && asm.k <= 0) continue;
      if (part.kind === 'piston') { emitPiston(list, view, part, W, o); continue; }
      if (part.kind === 'cable') { emitCable(list, view, part, W, o); continue; }
      const pl = place(W, part, asm);
      if (part.kind === 'box') emitBox(list, view, part, pl, o);
      else if (part.kind === 'cyl') emitCyl(list, view, part, pl, o);
      else if (part.kind === 'sphere') emitSphere(list, view, part, pl, o);
    }
    if (o.ground != null) {   // a soft contact shadow under the lowest point
      const pts = model.feet ? model.feet.map(f => view.proj(add(W[f[0]].p, mv(W[f[0]].R, f[1])))) : [];
      const xs = pts.map(p => p[0]); const cx = xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : o.x;

    ctx.save(); for (const it of list) it.draw(); ctx.restore();

  }

  /* screen position of a bone-space point (for effects anchored to the robot: the eye glow, muzzle flashes, sparks) */
  function point(model, o, bone, local = [0, 0, 0]) {
    const W = solve(model, o.pose || {}, o), view = viewOf(o);
    return view.proj(add(W[bone].p, mv(W[bone].R, local)));
  }

  /* the screen y of the lowest foot point for a pose (so a walk can plant its feet on the ground) */
  function lowestY(model, o) {
    const W = solve(model, o.pose || {}, o), view = viewOf(o);
    let m = -1e9; for (const f of model.feet || []) m = Math.max(m, view.proj(add(W[f[0]].p, mv(W[f[0]].R, f[1])))[1]);

  }

  const base = { x, y: 0, s: o.s ?? S, pitch: .14, ...o };
  const low = R3.lowestY(T800, base);
  return R3.draw(T800, { ...base, y: (o.ground ?? GROUND) - low, ground: o.ground ?? GROUND });
}
const label = (s, x, y) => txt(s, x, y, 15, '#cfe3ff', { font: TVFONT, weight: 900 });
function render(t, M) {
  grid();
  txt('T-800 · ΜΟΝΤΕΛΟ (model sheet v1)', 640, 34, 22, '#ffffff', { font: TVFONT, weight: 900 });
  if (t < M.sheet.b) {
    robot(300, { yaw: -.6, t, pose: T800.open(T800.P.guard, 0, .6), s: 1.0 }); label('3/4 · ΜΑΧΗ', 300, 690);
    const views = [[0, 'ΜΠΡΟΣΤΑ'], [-Math.PI / 2, 'ΠΡΟΦΙΛ'], [Math.PI, 'ΠΙΣΩ']];
    views.forEach(([yaw, name], i) => { const x = 700 + i * 220; robot(x, { yaw, t, pose: T800.P.idle, s: .5 }); label(name, x, 690); });
    // the parts list
    const L = ['κράνος: air fryer (μάτι LED)', 'θώρακας: ψυγείο + μαγνητάκια', 'κοιλιά: πλυντήριο (τύμπανο-αντιδραστήρας)', 'επωμίδες: κλιματιστικά inverter', 'μηροί: θερμοσίφωνες 80L', 'κνήμες: αφυγραντήρες', 'πέλματα: σκούπες ρομπότ', 'παλάμες: τοστιέρες (ανοίγουν)'];
    L.forEach((s, i) => txt(s, 1150, 110 + i * 26, 13, '#cfe3ff', { font: TVFONT, weight: 700, align: 'right' }));
    return;
  }
  if (t < M.turn.b) {
    const k = prog(t, M.turn.a, M.turn.b);
    robot(640, { yaw: k * TAU, t, pose: T800.P.idle, s: .72 }); label('ΠΕΡΙΣΤΡΟΦΗ 360°', 640, 690); return;
  }
  if (t < M.poses.b) {
    const names = ['idle', 'crouch', 'guard', 'punch', 'hit', 'scan'];
    const u = (t - M.poses.a) / (M.poses.b - M.poses.a) * names.length, i = Math.min(names.length - 1, Math.floor(u)), f = u - i;
    const a = T800.P[names[i]], b = T800.P[names[Math.min(names.length - 1, i + 1)]];
    const pose = R3.blend(a, b, ease(clamp((f - .6) / .4)));
    robot(420, { yaw: -.55, t, pose: T800.open(pose, names[i] === 'punch' ? 0 : .5, names[i] === 'guard' ? 1 : 0), s: .68 });
    robot(980, { yaw: .25, t, pose: T800.P[names[i]], s: .5 });
    label('ΠΟΖΑ: ' + names[i].toUpperCase(), 640, 690); return;
  }
  if (t < M.walk.b) {
    const ph = (t - M.walk.a) * 5.2, x = 900 - ph * T800.WALK_SPEED * .72;   // facing left, moving left at the stride speed
    robot(x, { yaw: -Math.PI / 2, t, pose: T800.walk(ph), s: .72 }); label('ΒΑΔΙΣΜΑ (ΠΡΟΦΙΛ)', 640, 690); return;
  }
  const k = prog(t, M.asm.a, M.asm.b - .8);
  robot(700, { yaw: -.5, t, pose: T800.P.idle, s: .72, asm: T800.assembly(k) });
  // the container the parts come from
  rect(40, 470, 240, 180, '#c9532e', { lw: 4 }); for (let i = 0; i < 9; i++) curve([[60 + i * 25, 480], [60 + i * 25, 640]], 3, '#8f3519', { w: 0 });
  txt('JUMBO', 160, 500, 22, '#fff', { font: TVFONT, weight: 900 });
  for (const s of T800.snapTimes(M.asm.a, M.asm.b - M.asm.a - .8)) if (t > s.t && t < s.t + .25) fxBurst(t, s.t, 700, 420, { kind: 'spark', n: 10, speed: 260, life: .3, seed: s.t * 7 });
  label('ΣΥΝΑΡΜΟΛΟΓΗΣΗ', 640, 690);
}
return { id: 'scene01', title: 'T-800 lab', steps, render, fade: false };
})());

</script>
<script>runEpisode(SCENES);</script>
