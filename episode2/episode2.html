<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<main>
  <header>
    <h1>Η Έξυπνη Σίτα · Τηλεφωνήστε Τώρα</h1>
    <p>Επεισόδιο 2 · ολόκληρο · space = play/pause · ←/→ = 5 δευτερόλεπτα</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <button id="big" aria-label="Play">▶</button>
  </div>
  <div class="bar">
    <button id="play">▶ Play</button>
    <button id="restart" title="Restart">⟲</button>
    <input type="range" id="scrub" min="0" max="1200" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00</span>
    <select id="chap" aria-label="Scene"></select>
    <button id="vo" title="Placeholder voices (browser text-to-speech)">🗣 Φωνές</button>
    <button id="lang" title="Subtitle language">EN</button>
    <button id="snd" title="Sound">🔊</button>
    <button id="fs" title="Fullscreen">⛶</button>
  </div>
  <div id="note">Placeholder voices by ElevenLabs (AI), until we record real voice actors. Lines without a clip fall back to your browser's Greek text-to-speech; 🗣 switches that to babble.</div>
</main>
