<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olympus Groundskeepers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4efe4; --panel:#fffaf0; --ink:#231a2e; --muted:#6b5f76; --accent:#c9962c; --btn:#231a2e; --btn-ink:#fffaf0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#16111d; --panel:#221a2c; --ink:#f4efe4; --muted:#a99cb6; --accent:#e5b54a; --btn:#f4efe4; --btn-ink:#16111d; }
  }
  :root[data-theme="dark"] { --bg:#16111d; --panel:#221a2c; --ink:#f4efe4; --muted:#a99cb6; --accent:#e5b54a; --btn:#f4efe4; --btn-ink:#16111d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Comfortaa, system-ui, sans-serif; }
  main { max-width:1120px; margin:0 auto; padding:20px 16px 40px; }
  header h1 { font-family:"Luckiest Guy", Comfortaa, sans-serif; font-weight:400; letter-spacing:1px; font-size:clamp(26px,5vw,44px); margin:0; }
  header p { margin:4px 0 16px; color:var(--muted); font-size:14px; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:14px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  canvas { display:block; width:100%; height:100%; }
  #big { position:absolute; inset:0; margin:auto; width:96px; height:96px; border-radius:50%; border:5px solid #231a2e; background:#ffd23f; color:#231a2e; font-size:40px; cursor:pointer; box-shadow:0 6px 0 #231a2e; }
  #big:hover { transform:translateY(-2px); }
  #big[hidden] { display:none; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; background:var(--panel); padding:10px; border-radius:12px; }
  .bar button { font:inherit; font-size:14px; border:0; border-radius:8px; padding:8px 12px; background:var(--btn); color:var(--btn-ink); cursor:pointer; min-width:44px; }
  .bar input[type=range] { flex:1 1 200px; accent-color:var(--accent); min-width:0; }
  #time { font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); min-width:84px; text-align:right; }
  .stage:fullscreen { border-radius:0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Olympus Groundskeepers</h1>
    <p>Οι Επιστάτες του Ολύμπου · Episode 1: “Labyrinth of Trash” · space = play/pause, ←/→ = seek</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <button id="big" aria-label="Play">▶</button>
  </div>
  <div class="bar">
    <button id="play">▶ Play</button>
    <button id="restart" title="Restart">⟲</button>
    <input type="range" id="scrub" min="0" max="79" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00 / 1:19</span>
    <button id="lang" title="Subtitle language">ΕΛ</button>
    <button id="snd" title="Sound">🔊</button>
    <button id="fs" title="Fullscreen">⛶</button>
  </div>
</main>
<script>
/* ============================================================
   OLYMPUS GROUNDSKEEPERS — Ep.1 "Labyrinth of Trash"
   Pure canvas. Every shape "boils" (redraws with a slight wobble
   at 8fps) for the hand-drawn look.
   ============================================================ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720, TAU = Math.PI * 2, INK = '#231a2e', DUR = 79;
let T = 0, playing = false, started = false, lang = 'en', soundOn = true, last = null;

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const back = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
function mixc(a, b, k) { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join(''); }
const blinkAt = (t, off) => ((t + off) % 4.1) < .13;

/* ---------- wobbly drawing primitives ---------- */
let SEED = 0, BOIL = 0;
const jit = (sd, i, k) => (hash(sd * 12.9898 + i * 78.233 + BOIL * 37.719 + k * 3.3) - .5) * 2;

function finish(fill, o) {
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 24; }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (o.lw !== 0) { ctx.lineWidth = o.lw || 4; ctx.strokeStyle = o.sc || INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
  ctx.restore();
}
function blob(x, y, rx, ry, fill, o = {}) {
  const sd = ++SEED, n = o.n || 26, w = o.w ?? 1.5, rot = o.rot || 0, cr = Math.cos(rot), sr = Math.sin(rot);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, j = jit(sd, i, 0) * w;
    const px = Math.cos(a) * (rx + j), py = Math.sin(a) * (ry + j);
    const X = x + px * cr - py * sr, Y = y + px * sr + py * cr;
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.closePath(); finish(fill, o);
}
const wp = (pts, sd, w) => pts.map((p, i) => [p[0] + jit(sd, i, 1) * w, p[1] + jit(sd, i, 2) * w]);
function poly(pts, fill, o = {}) {
  const sd = ++SEED, P = wp(pts, sd, o.w ?? 1.3), L = P.length;
  ctx.beginPath();
  if (o.smooth) {
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = m(P[L - 1], P[0]);
    ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < L; i++) { const mm = m(P[i], P[(i + 1) % L]); ctx.quadraticCurveTo(P[i][0], P[i][1], mm[0], mm[1]); }
  } else P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath(); finish(fill, o);
}
function curve(pts, lw = 4, col = INK, o = {}) {
  const sd = ++SEED, P = wp(pts, sd, o.w ?? 1.2), L = P.length;
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  if (L === 2) ctx.lineTo(P[1][0], P[1][1]);
  else for (let i = 1; i < L - 1; i++) {
    const last = i === L - 2;
    ctx.quadraticCurveTo(P[i][0], P[i][1], last ? P[i + 1][0] : (P[i][0] + P[i + 1][0]) / 2, last ? P[i + 1][1] : (P[i][1] + P[i + 1][1]) / 2);
  }
  finish(null, { ...o, lw, sc: col });
}
// thick stroke with an ink outline (limbs, horns, broom handles)
function limb(pts, lw, col, o = {}) { curve(pts, lw + 7, INK, o); SEED--; curve(pts, lw, col, o); }
function txt(s, x, y, size, col, o = {}) {
  ctx.font = `${o.weight || 700} ${size}px ${o.font || 'Comfortaa, sans-serif'}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc || INK; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const LOGO = '"Luckiest Guy", Comfortaa, sans-serif';

/* ---------- face parts ---------- */
function eye(x, y, r, lx, ly, bl, o = {}) {
  if (bl) { curve([[x - r, y + 2], [x, y + r * .3], [x + r, y + 2]], 3.5); SEED++; return; }
  blob(x, y, r, r * (o.sq || 1), '#fff', { lw: 3.5, w: .7 });
  const pr = o.pr || Math.max(2.6, r * .19);            // tiny dot pupils
  blob(x + lx * r * .5, y + ly * r * .5, pr, pr, o.pc || INK, { lw: 0, w: .2, n: 10 });
}
function brows(lx, ly, rx, ry, w, mood = 'flat', lw = 4, col = INK) {
  const m = { worry: [6, -6], sad: [6, -6], determined: [-6, 6], angry: [-8, 8] }[mood] || [0, 0];
  curve([[lx - w, ly + m[0]], [lx + w, ly + m[1]]], lw, col);
  if (mood === 'smug') curve([[rx - w, ry - 4], [rx, ry - 11], [rx + w, ry - 6]], lw, col);
  else curve([[rx - w, ry + m[1]], [rx + w, ry + m[0]]], lw, col);
}

/* ---------- props ---------- */
function broom(x1, y1, x2, y2, g) {
  const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a), ny = Math.cos(a), dx = Math.cos(a), dy = Math.sin(a);
  const go = g ? { glow: '#fff27a', gb: 30 } : {};
  limb([[x1, y1], [x2, y2]], 5, g ? '#ffe9a8' : '#9a6a3a', go);
  const w1 = 10, w2 = 26, Lb = 46;
  poly([[x2 + nx * w1, y2 + ny * w1], [x2 - nx * w1, y2 - ny * w1], [x2 - nx * w2 + dx * Lb, y2 - ny * w2 + dy * Lb], [x2 + nx * w2 + dx * Lb, y2 + ny * w2 + dy * Lb]],
    g ? '#fff4b0' : '#e9c46a', g ? { glow: '#ffd84a', gb: 40 } : {});
  for (let k = -2; k <= 2; k++) curve([[x2 + nx * k * 3 + dx * 6, y2 + ny * k * 3 + dy * 6], [x2 + nx * k * 8 + dx * (Lb - 4), y2 + ny * k * 8 + dy * (Lb - 4)]], 2, g ? '#e0b43a' : '#b8892f');
}
function labGun(x, y, glow) {
  poly([[x - 6, y + 4], [x + 6, y + 4], [x + 2, y + 24], [x - 10, y + 22]], '#7d8594', { lw: 3.5 });
  poly([[x - 16, y - 12], [x + 30, y - 13], [x + 34, y + 3], [x - 16, y + 7]], '#bcc3cf', { lw: 3.5 });
  curve([[x - 10, y - 3], [x - 4, y - 3], [x - 4, y - 8], [x + 4, y - 8], [x + 4, y - 3], [x + 12, y - 3], [x + 12, y - 8], [x + 20, y - 8]], 2.2, '#3d7a3a', { w: .3 });
  blob(x + 40, y - 5, 9, 9, '#7CFF6B', { lw: 3, glow: '#7CFF6B', gb: glow ? 30 : 12 });
}
function flask(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  poly([[-5, -30], [5, -30], [5, -18], [-5, -18]], '#bfe6c4', { lw: 3 });
  poly([[-10, -18], [10, -18], [13, 14], [-13, 14]], '#bfe6c4', { lw: 3.5 });
  poly([[-9, -6], [9, -6], [9, 5], [-9, 5]], '#fffaf0', { lw: 2 });
  txt('ΟΥΖΟ', 0, 0, 7, INK);
  ctx.restore();
}
function sparkle(x, y, r, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = '#fffbe0'; ctx.shadowColor = '#fff5a0'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill(); ctx.restore();
}
// Greek key (meander) strip, height = 6u
function meander(x, y, w, u, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = u * .55; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.moveTo(x, y + u * 6); ctx.lineTo(x + w, y + u * 6);
  const P = [[1, 6], [1, 1.3], [5, 1.3], [5, 4.7], [3, 4.7], [3, 3]];
  for (let cx = x; cx < x + w - u * 5; cx += u * 6) {
    ctx.moveTo(cx + P[0][0] * u, y + P[0][1] * u);
    for (const p of P.slice(1)) ctx.lineTo(cx + p[0] * u, y + p[1] * u);
  }
  ctx.stroke(); ctx.restore();
}
// labyrinth-shaped portal: counter-rotating broken rings
function portal(x, y, r, t, a = 1) {
  if (r < 1) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, 1.15); ctx.globalAlpha *= a;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, '#062a12'); g.addColorStop(.65, '#1c8a3a'); g.addColorStop(1, '#8dff6f');
  ctx.shadowColor = '#7CFF6B'; ctx.shadowBlur = 45; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineCap = 'round';
  for (let k = 1; k <= 5; k++) {
    const rr = r * k / 6, rot = t * (k % 2 ? 1 : -1) * (1.2 + k * .35), ea = rot + TAU * .8;
    ctx.strokeStyle = k % 2 ? '#d4ffc4' : '#3cf0a0'; ctx.lineWidth = Math.max(2, r * .04);
    ctx.beginPath(); ctx.arc(0, 0, rr, rot, ea); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(Math.cos(ea) * rr, Math.sin(ea) * rr); ctx.lineTo(Math.cos(ea) * (rr + r / 6), Math.sin(ea) * (rr + r / 6)); ctx.stroke();
  }
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.restore();
}
function bolt(x1, y1, x2, y2, seed, a) {
  const pts = [[x1, y1]], n = 9;
  for (let i = 1; i < n; i++) { const k = i / n; pts.push([lerp(x1, x2, k) + (hash(seed + i) - .5) * 80, lerp(y1, y2, k)]); }
  pts.push([x2, y2]);
  ctx.save(); ctx.globalAlpha *= a; ctx.lineJoin = 'miter';
  for (const [lw, col] of [[18, '#ffe14a'], [7, '#ffffff']]) {
    ctx.shadowColor = '#ffe14a'; ctx.shadowBlur = 30; ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  }
  ctx.restore();
}
function beam(x1, y1, x2, y2, col, t, w) {
  if (w <= 0) return;
  for (let k = 0; k < 3; k++) {
    ctx.save(); ctx.strokeStyle = k === 2 ? '#ffffff' : col; ctx.lineWidth = [30, 15, 5][k] * w;
    ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.lineCap = 'round'; ctx.globalAlpha = k === 0 ? .35 : 1;
    ctx.beginPath();
    for (let i = 0; i <= 28; i++) {
      const u = i / 28, px = lerp(x1, x2, u), py = lerp(y1, y2, u) + Math.sin(u * 14 - t * 30 + k * 2) * 12 * Math.sin(u * Math.PI);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke(); ctx.restore();
  }
}

/* ============================================================
   CHARACTERS  (local coords, feet at 0,0, up is -y)
   ============================================================ */
function glaukos(x, y, s, p = {}) {        // anxious owl — the straight man
  const t = p.t || 0, tk = p.talk || 0, B = '#6fa2d8', D = '#4f7fb5', L = '#e2edf8';
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (p.dir || 1), s); ctx.rotate(p.lean || 0);
  limb([[-16, -70], [-19, -35], [-20, 0]], 4, '#f0a93c'); limb([[16, -70], [19, -35], [20, 0]], 4, '#f0a93c');
  curve([[-20, 0], [-36, 5]], 4); curve([[-20, 0], [-6, 5]], 4); curve([[20, 0], [36, 5]], 4); curve([[20, 0], [6, 5]], 4);
  ctx.translate(0, Math.sin(t * 3.2) * 2.5);
  poly([[-20, -66], [0, -38], [20, -66]], D, { lw: 4 });
  blob(0, -125, 56, 74, B, { lw: 5 }); blob(5, -110, 36, 52, L, { lw: 3 });
  for (let i = 0; i < 3; i++) { const fx = -8 + i * 14, fy = -128 + (i % 2) * 14; curve([[fx - 6, fy], [fx, fy + 6], [fx + 6, fy]], 2.5, '#a9c3de'); }
  const hy = -230;
  poly([[-48, hy - 28], [-66, hy - 84], [-18, hy - 46]], B, { lw: 4.5 }); poly([[48, hy - 28], [66, hy - 84], [18, hy - 46]], B, { lw: 4.5 });
  blob(0, hy, 66, 57, B, { lw: 5 }); blob(0, hy + 2, 54, 44, '#c4d9ef', { lw: 0 });
  const lk = p.look || [0, 0], bl = blinkAt(t, 1.3);
  eye(-24, hy - 6, 22, lk[0], lk[1], bl); eye(24, hy - 6, 19, lk[0], lk[1], bl);
  brows(-24, hy - 37, 24, hy - 35, 15, p.brow, 4.5, '#2f4f7a');
  const op = tk * 16;
  if (op > 1) blob(0, hy + 28 + op / 2, 11, op / 2 + 3, '#5a1f2b', { lw: 3 });
  poly([[-11, hy + 12], [11, hy + 12], [0, hy + 32]], '#f5a53b', { lw: 3.5 });
  if (op > 1) poly([[-8, hy + 28 + op], [8, hy + 28 + op], [0, hy + 38 + op]], '#f5a53b', { lw: 3 });
  const mode = p.broom || 'hold', aim = p.pose === 'aim', glow = mode === 'glow';
  let lh = [-64, -100], rh = [64, -100];
  if (aim) { broom(70, -146, -70, -150, glow); rh = [42, -147]; lh = [-18, -149]; }
  else if (mode === 'hold' || glow) { broom(86, -235, 36, -30, glow); rh = [58, -120]; }
  if (!aim) { if (p.wave) lh = [-92, -232 + Math.sin(t * 12) * 14]; else if (tk > 0) lh = [-84, -196 + Math.sin(t * 7) * 12]; }
  const arm = (sh, h, o) => { limb([sh, [(sh[0] + h[0]) / 2 + o, (sh[1] + h[1]) / 2 + 6], h], 7, B); blob(h[0], h[1], 10, 8, B, { lw: 3.5 }); };
  arm([-46, -162], lh, -14); arm([46, -162], rh, 14);
  ctx.restore();
}

function tragos(x, y, s, p = {}) {         // loud slacker goat-satyr
  const t = p.t || 0, tk = p.talk || 0, F = '#a8784c', Fd = '#7d5634', Fl = '#e6cc9f';
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (p.dir || 1), s); ctx.rotate(p.lean || 0); ctx.translate(0, -(p.hop || 0));
  limb([[-16, -56], [-24, -28], [-16, -4]], 12, F); limb([[16, -56], [24, -28], [16, -4]], 12, F);
  blob(-16, -3, 12, 7, INK, { lw: 0 }); blob(16, -3, 12, 7, INK, { lw: 0 });
  poly([[-34, -84], [-60, -104], [-46, -74]], Fd, { lw: 3.5 });
  blob(0, -90, 45, 45, F, { lw: 5 }); blob(0, -82, 28, 30, Fl, { lw: 3 });
  const hy = -164 + Math.sin(t * 3) * 1.5;
  limb([[-24, hy - 30], [-42, hy - 64], [-70, hy - 62], [-68, hy - 40]], 8, '#efe2c2');
  limb([[24, hy - 30], [42, hy - 64], [70, hy - 62], [68, hy - 40]], 8, '#efe2c2');
  blob(-54, hy - 2, 22, 9, F, { rot: .35 }); blob(54, hy - 2, 22, 9, F, { rot: -.35 });
  blob(0, hy, 48, 43, F, { lw: 5 });
  blob(0, hy - 9, 43, 16, '#3a2922', { lw: 0 });                 // bandit mask
  const lk = p.look || [0, 0], bl = blinkAt(t, 2.1);
  eye(-17, hy - 11, 14, lk[0], lk[1], bl); eye(17, hy - 11, 12.5, lk[0], lk[1], bl);
  brows(-17, hy - 32, 17, hy - 31, 11, p.brow, 4.5, '#3a2922');
  poly([[-9, hy + 38], [9, hy + 38], [0, hy + 64]], Fl, { lw: 3 });  // goatee
  blob(0, hy + 18, 22, 15, Fl, { lw: 3.5 });
  blob(-7, hy + 14, 3, 2.5, INK, { lw: 0 }); blob(7, hy + 14, 3, 2.5, INK, { lw: 0 });
  if (tk > .05) blob(0, hy + 36, 14, 3 + tk * 11, '#5a1f2b', { lw: 3 });
  else if (p.brow === 'sad' || p.brow === 'worry') curve([[-10, hy + 38], [0, hy + 33], [10, hy + 38]], 3.5);
  else curve([[-11, hy + 33], [0, hy + 37], [12, hy + 30]], 3.5);
  const A = p.arms || 'idle'; let lh = [-50, -58], rh = [50, -58];
  if (A === 'up') { lh = [-62, -172]; rh = [62, -172]; }
  if (A === 'gun') { rh = [72, -108]; labGun(80, -112, p.glowGun); }
  if (A === 'broom') { broom(66, -205, 40, -24, p.glow); rh = [53, -112]; }
  if (A === 'aim') { broom(50, -100, -60, -104, p.glow); rh = [30, -101]; lh = [-12, -102]; }
  if (p.wave) lh = [-68, -172 + Math.sin(t * 12) * 12];
  else if (tk > 0 && A === 'idle') lh = [-66, -130 + Math.sin(t * 8) * 10];

  src.connect(f); f.connect(g); g.connect(master); src.start(n);
}
const SFX = {
  thunder: () => { noise(1.8, .5, 260); noise(.3, .35, 2200, .5, 'highpass'); },
  portal: () => { tone(180, 1, 'sine', .12, 4); tone(270, 1, 'triangle', .05, 3); },
  zap: () => tone(1400, .3, 'square', .05, .15),
  suck: () => tone(700, 2.6, 'sine', .06, .2),
  rumble: () => noise(3, .35, 110),
  roar: () => { tone(90, 1.5, 'sawtooth', .14, .6); noise(1.3, .25, 500); },
  beam: () => { tone(440, 5.8, 'sawtooth', .025, 2); tone(660, 5.8, 'triangle', .04, 1.5); },
  pop: () => tone(700, .35, 'sine', .15, .1),
  burp: () => { tone(105, .9, 'sawtooth', .14, .6); noise(.8, .12, 280); },
  burpsmall: () => tone(140, .35, 'sawtooth', .1, .6),
  whoosh: () => noise(.45, .25, 1200, 1, 'bandpass'),
  sting: () => [0, 4, 7, 12].forEach((s, i) => setTimeout(() => tone(293.66 * 2 ** (s / 12), .5, 'triangle', .08), i * 110)),
};
const EVENTS = [[.5, 'sting'], [7.4, 'whoosh'], [12.5, 'thunder'], [21.5, 'portal'], [24.6, 'burpsmall'], [34.85, 'whoosh'], [35.8, 'zap'], [35.9, 'portal'],
  [36.2, 'suck'], [39.5, 'rumble'], [42.4, 'roar'], [47, 'thunder'], [48.4, 'whoosh'], [48.9, 'burpsmall'], [51.4, 'beam'], [57.4, 'pop'],
  [59.4, 'whoosh'], [64.1, 'burp'], [65.6, 'portal'], [67, 'thunder'], [73.2, 'sting']];
// bouzouki-ish plucks in the Hijaz (Χιτζάζ) mode on D
const HIJ = [0, 1, 4, 5, 7, 8, 10, 12], PAT = [0, 4, 2, 4, 3, 4, 2, 1, 0, 4, 5, 4, 3, 2, 1, 0], STEP = .23;
function musicStep(k, t) {
  const storm = t > 45.6 && t < 58, vol = (t < 7 || t > 72.5) ? .05 : .026;
  const f = 293.66 * Math.pow(2, HIJ[PAT[k % 16]] / 12) * (storm ? .5 : 1);
  tone(f, .22, 'triangle', vol); tone(f * 2, .1, 'sine', vol * .4);
  if (k % 8 === 0) tone(73.42, .4, 'sine', vol * 2);
  if (storm && k % 2 === 0) tone(120, .18, 'sine', .1, .3);
}
const VO = { glaukos: [330, 'triangle'], tragos: [560, 'square'], daedalus: [210, 'sawtooth'], zeus: [150, 'square'], minotaur: [80, 'sawtooth'], 'glaukos+tragos': [440, 'square'] };
function audioTick(a, b) {
  if (!soundOn || !AC) return;
  for (const [et, s] of EVENTS) if (et > a && et <= b) SFX[s]();
  if (b < 78) { const sa = Math.floor(a / STEP), sb = Math.floor(b / STEP); for (let k = sa + 1; k <= sb; k++) musicStep(k, b); }
  const L = LINES.find(l => b >= l.a && b < l.b && !l.nob);
  if (L && Math.floor(b / .09) > Math.floor(a / .09)) { const [f, ty] = VO[L.who]; tone(f * (.85 + Math.random() * .35), .07, ty, ty === 'square' ? .022 : .04, .9 + Math.random() * .3); }
}

/* ============================================================
   PLAYER
   ============================================================ */
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function updateUI() {
  $('play').textContent = playing ? '❚❚ Pause' : '▶ Play';
  $('big').hidden = playing || started;
  $('lang').textContent = lang === 'en' ? 'ΕΛ' : 'EN';
  $('snd').textContent = soundOn ? '🔊' : '🔇';
}
function play() { ensureAudio(); if (T >= DUR) T = 0; playing = true; started = true; updateUI(); }
function pause() { playing = false; updateUI(); }
$('big').onclick = play;
$('play').onclick = () => playing ? pause() : play();
$('restart').onclick = () => { T = 0; play(); };
$('scrub').oninput = e => { T = +e.target.value; started = true; updateUI(); };
$('lang').onclick = () => { lang = lang === 'en' ? 'el' : 'en'; document.documentElement.lang = lang; updateUI(); };
$('snd').onclick = () => { soundOn = !soundOn; if (soundOn) ensureAudio(); updateUI(); };
$('fs').onclick = () => { const s = $('stage'); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.(); };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.code !== 'Space') return;
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === 'ArrowRight') { T = Math.min(DUR, T + 5); started = true; }
  if (e.code === 'ArrowLeft') { T = Math.max(0, T - 5); started = true; }
});
function frame(now) {
  if (last == null) last = now;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) { const prev = T; T += dt; if (T >= DUR) { T = DUR; pause(); } audioTick(prev, T); }
  render(started ? T : 3.2);                    // poster frame before first play
  $('scrub').value = T; $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`;
  requestAnimationFrame(frame);
}
window.renderAt = t => { started = true; T = t; updateUI(); render(t); };   // handy for exporting stills
updateUI(); requestAnimationFrame(frame);
</script>
