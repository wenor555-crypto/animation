<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Η Έξυπνη Σίτα · Σκηνή 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Noto+Sans:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="player.css">
</head>
<body>
<main>
  <header>
    <h1>Η Έξυπνη Σίτα</h1>
    <p>Επεισόδιο 1 · Σκηνή 2: Η αυλή · space = play/pause</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <button id="big" aria-label="Play">▶</button>
  </div>
  <div class="bar">
    <button id="play">▶ Play</button>
    <button id="restart" title="Restart">⟲</button>
    <input type="range" id="scrub" min="0" max="60" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00</span>
    <button id="vo" title="Placeholder voices (browser text-to-speech)">🗣 Φωνές</button>
    <button id="lang" title="Subtitle language">EN</button>
    <button id="snd" title="Sound">🔊</button>
    <button id="fs" title="Fullscreen">⛶</button>
  </div>
  <div id="note">The voices are placeholders from your browser's Greek text-to-speech (if your system has one). Turn them off with 🗣 to hear gibberish babble instead, until we record real voice actors.</div>
</main>
<script src="engine.js"></script>
<script src="characters.js"></script>
<script src="sets.js"></script>
<script src="props.js"></script>
<script src="scenes/s02.js"></script>
<script>runScene(SCENES[0]);</script>
</body>
</html>
