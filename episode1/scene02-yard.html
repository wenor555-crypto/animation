<script>
/* =========================================================
   Ep.1, Scene 2 – «Η αυλή» (script beats 2 → start of 3)
   ========================================================= */
const GROUND = 690, SEAT = 560;
const POS = { giannos: 460, mimis: 640, giorgos: 820 };

const LINES = [
  { a: 3.8,  b: 7.6,  who: 'giannos', el: 'Εφτά χρόνια στη Δανία. Εφτά. Ούτε ένα κουνούπι.', en: 'Seven years in Denmark. Seven. Not one mosquito.' },

  { a: 11.5, b: 12.9, who: 'mimis',   el: 'Σε τρώει η κατάθλιψη.', en: 'Depression does.' },
  { a: 13.3, b: 14.6, who: 'giannos', el: '…Δεν είναι το ίδιο.', en: "…That's not the same." },

  { a: 17.2, b: 20.5, who: 'giorgos', el: 'Ρε σεις, αν με πάρει τηλέφωνο ο λοχίας, είμαι στο νοσοκομείο.', en: "Guys, if the sergeant calls, I'm in the hospital." },
  { a: 20.7, b: 21.9, who: 'giannos', el: 'Δεν είσαι σε έξοδο;', en: "Aren't you on leave?" },
  { a: 22.1, b: 24.3, who: 'giorgos', el: 'Τυπικά, αυτή τη στιγμή είμαι σκοπιά.', en: "Technically, right now I'm on guard duty." },
  { a: 24.5, b: 25.7, who: 'mimis',   el: 'Και ποιος φυλάει;', en: "So who's guarding?" },
  { a: 26.0, b: 29.1, who: 'giorgos', el: 'Ένας νέος. Του είπα ότι είναι «ευκαιρία ανάπτυξης».', en: 'A new recruit. I told him it\'s a "growth opportunity".' },
  { a: 29.3, b: 30.3, who: 'giannos', el: 'Και το \'φαγε;', en: 'And he bought it?' },
  { a: 30.5, b: 32.5, who: 'giorgos', el: 'Μου έδωσε και το κολατσιό του.', en: 'He gave me his lunch too.' },
  { a: 33.6, b: 36.6, who: 'maria',   el: 'Μήμη! Η κόρη της Τούλας παντρεύεται τον Σεπτέμβρη!', en: "Mimis! Toula's daughter is getting married in September!" },
  { a: 36.9, b: 38.3, who: 'mimis',   el: 'Συγχαρητήρια στην Τούλα.', en: 'Congrats to Toula.' },
  { a: 38.6, b: 40.4, who: 'maria',   el: 'Εσύ πότε θα νοικοκυρευτείς;', en: 'When are YOU going to settle down?' },
  { a: 40.8, b: 42.4, who: 'mimis',   el: 'Όταν νοικοκυρευτείς εσύ.', en: 'When you do.' },
  { a: 44.7, b: 45.3, who: 'giorgos', el: 'Ωχ.', en: 'Oof.' },

  { a: 52.1, b: 54.6, who: 'vasilis', el: 'Παιδιά. Τελείωσε το μαρτύριο.', en: 'Boys. The torment is over.' },
  { a: 55.0, b: 56.4, who: 'mimis',   el: 'Πέθανε η θεία;', en: 'Did auntie die?' },

const VOICES = {
  giannos: { el: 'ΓΙΑΝΝΟΣ', en: 'GIANNOS', col: '#8cc4ff', pitch: .95, rate: 1.05, babble: 300 },
  mimis:   { el: 'ΜΗΜΗΣ', en: 'MIMIS', col: '#d0d0d6', pitch: .75, rate: .92, babble: 230 },
  giorgos: { el: 'ΓΙΩΡΓΟΣ', en: 'GIORGOS', col: '#9be08a', pitch: 1.1, rate: 1.1, babble: 340 },
  maria:   { el: 'ΜΑΡΙΑ', en: 'MARIA', col: '#ff9ac6', pitch: 1.5, rate: 1.12, babble: 480 },
  vasilis: { el: 'ΒΑΣΙΛΗΣ', en: 'VASILIS', col: '#ffd23f', pitch: .5, rate: .82, babble: 170 },
};

/* ---------- shots (hard cuts, slow push inside each) ---------- */
const CAMS = {
  wide: [640, 360, 1], three: [640, 430, 1.35], giannos: [460, 370, 2.1], mimis: [640, 370, 2.1], giorgos: [820, 370, 2.1],
  two: [550, 410, 1.6], win: [890, 240, 2.4], door: [860, 400, 1.2], vasilis: [960, 300, 1.7],
};
const SHOTS = [[0, 'wide'], [3.6, 'giannos'], [7.8, 'mimis'], [9.2, 'giannos'], [11.4, 'mimis'], [13.2, 'two'], [17.1, 'giorgos'], [20.6, 'three'],
  [25.9, 'giorgos'], [29.2, 'three'], [32.9, 'wide'], [33.5, 'win'], [36.8, 'mimis'], [38.5, 'win'], [40.7, 'mimis'], [43.2, 'win'], [44.4, 'three'],
  [48.2, 'door'], [51.9, 'vasilis'], [54.9, 'mimis'], [56.4, 'vasilis']];
function camera(t) {
  let i = 0; while (i < SHOTS.length - 1 && t >= SHOTS[i + 1][0]) i++;
  const [st, name] = SHOTS[i], [x, y, z] = CAMS[name];
  return { x, y, z: z * (1 + (t - st) * .008) };
}

/* ---------- background ---------- */
function acroSmall() {
  poly([[-100, 430], [0, 360], [60, 320], [130, 300], [200, 318], [290, 380], [380, 430]], '#b9a78e', { lw: 3.5, w: .5 });
  for (const [x, y] of [[60, 314], [130, 294], [200, 312]]) rect(x - 5, y - 12, 10, 12, '#a39179', { lw: 2 });
}
function figTree(x, y, t) {
  limb([[x, y], [x + 10, y - 120], [x - 20, y - 220]], 26, '#9a948a', { w: .6 });
  limb([[x + 8, y - 130], [x + 90, y - 210]], 14, '#9a948a', { w: .6 });
  for (const [bx, by, r] of [[-90, -240, 70], [0, -290, 90], [100, -250, 80], [-40, -200, 60], [60, -200, 64], [150, -200, 52]]) blob(x + bx + Math.sin(t + bx) * 2, y + by, r, r * .75, '#4f7a37', { lw: 4, w: 1.5 });
  for (let i = 0; i < 14; i++) blob(x - 120 + hash(i) * 280, y - 320 + hash(i + 3) * 160, 12, 8, '#6a9848', { lw: 0, rot: hash(i) * 3 });
  for (let i = 0; i < 5; i++) blob(x - 60 + hash(i + 11) * 180, y - 220 + hash(i + 13) * 60, 7, 8, '#6b3d5e', { lw: 2 });
}
function coop(x, y) {
  poly([[x, y], [x + 190, y], [x + 190, y - 120], [x, y - 120]], '#b58a5a', { lw: 4 });
  poly([[x - 12, y - 120], [x + 202, y - 120], [x + 95, y - 170]], '#8f5e3c', { lw: 4 });
  ctx.save(); ctx.strokeStyle = 'rgba(40,40,40,.45)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.moveTo(x + 14 + i * 9, y - 104); ctx.lineTo(x + 14 + i * 9 + 30, y - 14); ctx.moveTo(x + 44 + i * 9, y - 104); ctx.lineTo(x + 14 + i * 9, y - 14); ctx.stroke(); }
  ctx.restore();
  rect(x + 14, y - 104, 162, 90, null, { lw: 3 });
}
function chicken(x, y, t, seed, col = '#f3efe6') {
  const peck = Math.max(0, Math.sin(t * 2 + seed * 4)) > .8 ? 10 : 0;
  blob(x, y - 18, 20, 15, col, { lw: 3, w: .5 });
  poly([[x - 18, y - 24], [x - 30, y - 38], [x - 24, y - 14]], col, { lw: 3, w: .4 });
  blob(x + 16, y - 34 + peck, 9, 9, col, { lw: 3, w: .4 });
  blob(x + 16, y - 45 + peck, 4, 4, '#d8392b', { lw: 0 });
  poly([[x + 24, y - 34 + peck], [x + 31, y - 31 + peck], [x + 24, y - 29 + peck]], '#f2a33a', { lw: 2 });
  blob(x + 18, y - 36 + peck, 1.6, 1.6, INK, { lw: 0 });
  curve([[x - 4, y - 4], [x - 4, y + 4]], 2.5); curve([[x + 4, y - 4], [x + 4, y + 4]], 2.5);
}
function house(t) {
  rect(760, 60, 800, 640, '#f3eee2', { lw: 4, w: .6 });
  rect(740, 42, 840, 22, '#c4643c', { lw: 4, w: .5 });
  for (let i = 0; i < 26; i++) curve([[748 + i * 32, 44], [748 + i * 32, 62]], 2, '#9c4a2a', { w: .3 });
  poly([[760, 640], [1560, 640], [1560, 700], [760, 700]], '#cfc4ae', { lw: 3.5, w: .5 });
  for (let i = 0; i < 12; i++) blob(790 + i * 66, 668, 26, 14, '#bfb39b', { lw: 2.5, w: .8 });
  // door (Greek blue frame, dark interior)
  rect(1000, 470, 120, 222, '#3f74a6', { lw: 4, w: .4 }); rect(1012, 482, 96, 210, '#2a2420', { lw: 3, w: .4 });
  // upper window with green shutters is drawn in window()
  // bougainvillea
  for (let i = 0; i < 16; i++) blob(960 + hash(i) * 110 + Math.sin(t + i) * 1.5, 420 + hash(i + 4) * 70 - (i % 4) * 10, 20, 15, i % 3 ? '#d63f86' : '#b8306f', { lw: 2.5, w: 1 });
  for (let i = 0; i < 6; i++) blob(960 + hash(i + 20) * 110, 440 + hash(i + 24) * 60, 12, 8, '#4f7a37', { lw: 0 });
  // AC unit dripping
  rect(1200, 330, 130, 80, '#e9e9e4', { lw: 3.5, w: .4 }); blob(1250, 370, 28, 28, '#d2d2cc', { lw: 3 });
  for (let i = 0; i < 5; i++) curve([[1228 + i * 11, 346], [1228 + i * 11, 394]], 2, '#b8b8b2', { w: .2 });
  const dp = (t * .8) % 1; blob(1310, 412 + dp * 270, 3, 4, '#8fc5e0', { lw: 0 });
  blob(1310, 684, 20, 5, 'rgba(90,120,140,.3)', { lw: 0 });
  // pots (τενεκέδες) with basil & geranium
  for (const [px, col] of [[1140, '#d8392b'], [1190, '#4f7a37'], [950, '#e0527a']]) { rect(px - 20, 646, 40, 44, '#c8ccd0', { lw: 3, w: .4 }); for (let i = 0; i < 6; i++) blob(px - 16 + hash(i + px) * 32, 632 - hash(i + px + 1) * 24, 10, 8, i % 2 ? col : '#4f7a37', { lw: 2, w: .6 }); }
}
function windowFrame(t, shutK) {
  rect(830, 170, 120, 130, '#2a2420', { lw: 4, w: .4 });
  rect(820, 300, 140, 12, '#e3dccb', { lw: 3.5, w: .3 });
  // shutters: open (flat against wall) → closed (covering window)
  for (const side of [-1, 1]) {
    const cx = side < 0 ? 830 : 950, w = 60 * (side < 0 ? 1 : -1);
    const openX = side < 0 ? 830 - 62 : 950 + 2, closedX = side < 0 ? 830 : 890;
    const x0 = lerp(openX, closedX, shutK);
    rect(x0, 168, 60, 134, '#3d8a5a', { lw: 3.5, w: .4 });
    for (let i = 0; i < 9; i++) curve([[x0 + 6, 180 + i * 13], [x0 + 54, 180 + i * 13]], 2, '#2c6a44', { w: .2 });
  }
}
function clothesline(t) {
  curve([[240, 190], [500, 214], [760, 196]], 2.5, '#6a6a6a', { w: .3 });
  for (const [x, w, h, col] of [[300, 60, 80, '#e05a4a'], [380, 70, 60, '#f2d34a'], [470, 50, 90, '#6fa7d8'], [560, 80, 70, '#f4f3ee'], [660, 40, 50, '#b9477a']]) {
    const y = 200 + (x - 240) * .03 - Math.max(0, x - 500) * .06, sway = Math.sin(t * 1.5 + x) * 3;
    poly([[x, y], [x + w, y], [x + w + sway, y + h], [x + sway, y + h]], col, { lw: 3, w: .6 });
    for (const px of [x + 6, x + w - 6]) rect(px - 2, y - 6, 4, 10, '#a37a4a', { lw: 1.5, w: 0 });
  }
}
function background(t) {
  const g = ctx.createLinearGradient(0, -200, 0, 420); g.addColorStop(0, '#9fd3ea'); g.addColorStop(1, '#f1ecd6');
  ctx.fillStyle = g; ctx.fillRect(-400, -400, 2200, 900);
  acroSmall();
  // tomatoes over the garden wall
  for (let i = 0; i < 9; i++) { limb([[-40 + i * 60, 440], [-40 + i * 60, 350]], 3, '#6a8a3a', { w: .5 }); blob(-40 + i * 60, 370, 22, 30, '#5f8a3a', { lw: 3, w: 1 }); blob(-30 + i * 60, 392, 7, 7, '#d8392b', { lw: 2 }); }
  rect(-400, 430, 1160, 270, '#ebe2cd', { lw: 4, w: .6 });
  rect(-410, 420, 1180, 16, '#d9ceb4', { lw: 3.5, w: .5 });
  clothesline(t);
  figTree(170, 690, t);
  coop(-80, 690);
  house(t);
  windowFrame(t, shutters(t));
  // yard floor
  poly([[-400, 690], [1600, 690], [1600, 800], [-400, 800]], '#d9d0bd', { lw: 0 });
  curve([[-400, 690], [1600, 690]], 4);
  curve([[300, 720], [360, 706], [420, 716]], 2, '#b8ad96');
  chicken(40 + Math.sin(t * .3) * 30, 700, t, 1); chicken(250, 712, t, 2, '#b97a4a'); chicken(1340, 706, t, 3);
}
const shutters = t => ease(prog(t, 43.4, 43.62));

/* ---------- the table set ---------- */
function chair(x) {
  poly([[x - 62, SEAT - 158], [x + 62, SEAT - 158], [x + 56, SEAT - 40], [x - 56, SEAT - 40]], '#efeadb', { lw: 4, w: .5 });
  for (let i = 0; i < 4; i++) curve([[x - 36 + i * 24, SEAT - 140], [x - 36 + i * 24, SEAT - 60]], 3, '#d7d0bb', { w: .3 });
  for (const side of [-1, 1]) limb([[x + side * 50, SEAT + 10], [x + side * 62, GROUND]], 8, '#efeadb', { w: .3 });
}
function table(t) {
  for (const lx of [400, 880]) limb([[lx, 560], [lx - (lx < 640 ? 10 : -10), GROUND]], 12, '#ece7da', { w: .3 });
  poly([[370, 538], [910, 538], [928, 556], [352, 556]], '#f1ede2', { lw: 4, w: .5 });
  rect(352, 556, 576, 12, '#ddd7c7', { lw: 3.5, w: .4 });
  // ashtray-can, packs, lighter
  rect(610, 516, 30, 30, '#c9ced4', { lw: 3, w: .3 }); blob(625, 516, 15, 4, '#8a8f96', { lw: 2.5 });
  for (let i = 0; i < 3; i++) rect(616 + i * 6, 506 - i * 2, 3, 12, '#f2efe6', { lw: 1.2, w: 0 });
  rect(540, 526, 34, 20, '#e8e4dc', { lw: 2.5, w: .3 }); rect(540, 526, 34, 7, '#c0392b', { lw: 0 });
  rect(730, 528, 26, 18, '#1f3a5a', { lw: 2.5, w: .3 });
  rect(700, 534, 10, 12, '#e2b43c', { lw: 2, w: .2 });
}

/* ---------- blocking ---------- */
function lookFor(who, t) {
  if (t >= 33 && t < 44) return [.7, -.9];                        // Maria's window
  if (t >= 48.4) return who === 'vasilis' ? [-.8, .3] : [1, -.4];  // the door / Vasilis
  const sp = LINES.find(l => t >= l.a - .3 && t < l.b + .4);
  const target = sp ? sp.who : 'mimis';
  if (target === who || !POS[target]) return who === 'giorgos' && t > 16.9 && t < 20.6 ? [-.2, .9] : [0, .1];
  return [Math.sign(POS[target] - POS[who]), .1];
}
function drawTableScene(t) {
  const sG = [1.2, 4.0, 6.3], sGe = [2.2], sM = [];
  const ppl = {
    giannos: () => {
      const k = slapK(t, sG), L = lerp2([-44, -24], [34, -60], k);
      return { t, talk: talk('giannos', t), look: lookFor('giannos', t), brow: t > 13 && t < 15 ? 'worry' : 'flat', L, R: [48, -30], itemR: 'cig', mouth: 'flat' };
    },
    mimis: () => {
      const sip = Math.max(bump(t, 1.4, 2.6), bump(t, 14.6, 15.6));
      return { t, talk: talk('mimis', t), look: lookFor('mimis', t), lid: t < 48.2, mouth: 'smirk', L: [-40, -26], R: lerp2([44, -20], [16, -176], sip), itemR: 'cup', itemL: 'cig' };
    },
    giorgos: () => {
      const onPhone = t > 16.9 && t < 20.6, k = slapK(t, sGe), tk = talk('giorgos', t);
      let L = [-44, -24];
      if (tk > 0 && !onPhone) L = [-70, -90 + Math.sin(t * 7) * 12];
      L = lerp2(L, [-14, -250], k);
      return { t, talk: tk, look: lookFor('giorgos', t), brow: t > 44.5 && t < 46 ? 'worry' : 'flat', L, R: onPhone ? [20, -110] : [44, -22], itemR: onPhone ? 'phone' : null, mouth: 'smirk' };
    },
  };
  const S = {}; for (const k in ppl) S[k] = ppl[k]();
  for (const k in POS) chair(POS[k]);
  for (const k in POS) person(POS[k], SEAT, 1, CAST[k], { ...S[k], part: 'legs' });
  for (const k in POS) person(POS[k], SEAT, 1, CAST[k], { ...S[k], part: 'body' });
  table(t);
  freddo(470, 540); freddo(836, 540);
  for (const k in POS) person(POS[k], SEAT, 1, CAST[k], { ...S[k], part: 'arms' });
}
function drawMaria(t) {
  if (t < 33 || t > 43.7) return;
  const up = back(prog(t, 33.1, 33.6)) * (1 - prog(t, 43.2, 43.45));
  ctx.save(); ctx.beginPath(); ctx.rect(832, 172, 116, 126); ctx.clip();
  person(890, 470 - up * 60, .82, CAST.maria, { t, talk: talk('maria', t), look: [-.6, .7], brow: t > 38 ? 'frown' : 'up', part: 'body' });
  ctx.restore();
}
function vasilisX(t) { return lerp(1060, 960, ease(prog(t, 48.6, 51.2))); }
function drawRays(t) {           // the "Oscar" light, behind everyone
  const glow = prog(t, 49.2, 49.8); if (t < 48.5 || glow <= 0) return;
  ctx.save(); ctx.globalAlpha = glow * .55; ctx.translate(vasilisX(t), GROUND - 150 - 330);
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + t * .4; ctx.fillStyle = i % 2 ? '#fff6b0' : '#ffe27a'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 900, a, a + .18); ctx.fill(); }
  ctx.restore();
}
function drawVasilis(t) {
  if (t < 48.5) return;
  const k = ease(prog(t, 48.6, 51.2)), x = lerp(1060, 960, k), walking = t < 51.2;
  const s = lerp(.92, 1, k), hips = GROUND - 150 * s;
  const st = { t, talk: talk('vasilis', t), look: t > 55 ? [-.9, .3] : [-.6, .2], legs: walking ? 'walk' : 'stand', L: [-44, -300], R: [44, -300], lid: t > 55, mouth: t > 56.4 ? 'flat' : 'smile' };
  person(x, hips, s, CAST.vasilis, st);
  // the box, held up like an Oscar
  ctx.save(); ctx.translate(x, hips - 338 * s); ctx.scale(s, s);
  rect(-70, -46, 140, 92, '#e9e4d8', { lw: 4, w: .5 });
  rect(-64, -40, 58, 80, '#2a2a30', { lw: 2.5, w: .3 });
  for (let i = 0; i < 6; i++) curve([[-60 + i * 9, -38], [-60 + i * 9, 38]], 1.2, '#6a6a72', { w: .1 });
  blob(-40, -10, 6, 6, '#f3d38a', { lw: 1.5 }); blob(-24, -6, 5, 5, '#f3d38a', { lw: 1.5 });
  txt('ΕΞΥΠΝΗ', 32, -20, 17, '#e8392b', { font: TVFONT, style: 'italic', weight: 900 });
  txt('ΣΙΤΑ', 32, 2, 22, '#e8392b', { font: TVFONT, style: 'italic', weight: 900 });
  txt('ΜΑΓΝΗΤΙΚΗ', 32, 24, 10, '#231a2e', { font: TVFONT, weight: 900 });
  ctx.restore();
  // the flies that came in with him
  for (let i = 0; i < 15; i++) {
    const p = prog(t, 48.6 + i * .03, 52 + i * .1), ax = x + Math.cos(t * 3 + i) * (40 + i * 6) * (1 + p), ay = hips - 200 + Math.sin(t * 4 + i * 2) * (30 + i * 3) - p * 60;

  }
}
function render(t) {

  ctx.restore();

}
