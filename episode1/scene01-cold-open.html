function cam(t) {
  let i = 0; while (i < CAMK.length - 2 && t >= CAMK[i + 1][0]) i++;
  const a = CAMK[i], b = CAMK[i + 1], k = ease(clamp((t - a[0]) / (b[0] - a[0])));
  return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: lerp(a[3], b[3], k) };
}
const truckX = t => lerp(1700, -600, prog(t, 16.6, 23.2));
function mosqPath(t) {   // screen-space flight in the black opening
  return { x: 640 + Math.sin(t * 1.3) * 420 + Math.sin(t * 5.1) * 40, y: 360 + Math.sin(t * 2.1) * 120 + Math.cos(t * 6.3) * 30, s: 1.4 + Math.sin(t * .9) * .5, f: Math.cos(t * 1.3) > 0 ? 1 : -1 };
}

function drawWorld(t) {
  const c = cam(t);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(c.z, c.z); ctx.translate(-c.x, -c.y);
  landscape(t);
  const tx = truckX(t); if (tx < 1650 && tx > -550) {     // far lane, behind the dog
    ctx.save(); ctx.translate(tx, 522); ctx.scale(.8, .8); truck(0, 0, t); ctx.restore();
    for (let i = 0; i < 8; i++) { const p = ((t * 2 + i / 8) % 1); blob(tx + 160 + p * 140, 560 - p * 30, 8 + p * 22, 6 + p * 15, `rgba(215,195,150,${.55 * (1 - p)})`, { lw: 0 }); }
  }
  dog(600, 604, t);
  ctx.restore();
}
function mangaFlash(t) {
  const k = prog(t, 23.9, 24.25);
  ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#231a2e';
  for (let y = 0; y < H; y += 9) for (let x = (y / 9) % 2 ? 4 : 0; x < W; x += 9) { const d = Math.hypot(x - 640, y - 360) / 700; ctx.beginPath(); ctx.arc(x, y, 1.1 + d * 2.2, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = '#231a2e';
  for (let i = 0; i < 70; i++) { const a = hash(i) * TAU, r0 = 170 + hash(i + 9) * 90; ctx.lineWidth = 1 + hash(i + 3) * 4; ctx.beginPath(); ctx.moveTo(640 + Math.cos(a) * r0, 360 + Math.sin(a) * r0); ctx.lineTo(640 + Math.cos(a) * 900, 360 + Math.sin(a) * 900); ctx.stroke(); }
  ctx.fillStyle = '#f4f1ea'; ctx.beginPath(); ctx.arc(640, 360, 170, 0, TAU); ctx.fill();
  ctx.save(); ctx.filter = 'grayscale(1) contrast(1.6)'; mosquito(640, 360, 7, t, -1); ctx.restore();
  ctx.save(); ctx.translate(900, 170); ctx.rotate(-.18); ctx.scale(1 + k * .15, 1 + k * .15);
  txt('ΖΖΖ!', 0, 0, 130, '#f4f1ea', { font: TVFONT, style: 'italic', weight: 900, stroke: 16, sc: '#231a2e' });
  ctx.restore();
  ctx.lineWidth = 14; ctx.strokeStyle = '#231a2e'; ctx.strokeRect(7, 7, W - 14, H - 14);
}
function titleCard(t) {
  ctx.fillStyle = '#d7c69b'; ctx.fillRect(0, 0, W, H);
  const k = back(prog(t, 24.4, 25.5));
  const panel = (x0, side) => {
    ctx.save(); ctx.translate(x0, 0);
    ctx.fillStyle = 'rgba(28,26,30,.93)'; ctx.fillRect(0, 0, 640, H);
    ctx.strokeStyle = 'rgba(120,120,125,.55)'; ctx.lineWidth = 2;
    for (let x = 12; x < 640; x += 14) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + Math.sin(t * 2 + x) * 1.5, H); ctx.stroke(); }
    ctx.fillStyle = '#0d0c0e'; ctx.fillRect(side > 0 ? 626 : 0, 0, 14, H); ctx.fillRect(0, 0, 640, 18); ctx.fillRect(0, H - 18, 640, 18);
    for (let i = 0; i < 9; i++) { ctx.fillStyle = '#5b5b62'; ctx.fillRect(side > 0 ? 626 : 0, 50 + i * 72, 14, 22); }
    ctx.restore();
  };
  const flap = Math.max(0, Math.sin((t - 25.5) * 3)) * 10 * (1 - prog(t, 25.5, 28));
  panel(lerp(-660, 0 - flap, k), 1); panel(lerp(1300, 640 + flap, k), -1);
  if (t > 25.35) {
    const p = back(prog(t, 25.6, 26.3));
    ctx.save(); ctx.translate(640, 330); ctx.rotate(-.05); ctx.scale(p, p);
    const pts = []; for (let i = 0; i < 32; i++) { const r = i % 2 ? 250 : 300, a = i / 32 * TAU; pts.push([Math.cos(a) * r * 1.5, Math.sin(a) * r * .75]); }
    poly(pts, '#ffd23f', { lw: 7, w: .8 });
    txt('Η ΕΞΥΠΝΗ', 0, -52, 92, '#e8392b', { font: TVFONT, style: 'italic', weight: 900, stroke: 14, sc: '#fff' });
    txt('ΣΙΤΑ', 0, 50, 132, '#e8392b', { font: TVFONT, style: 'italic', weight: 900, stroke: 16, sc: '#fff' });
    ctx.restore();
  }
  if (t > 26.6) {
    ctx.save(); ctx.globalAlpha = prog(t, 26.6, 27.2); ctx.translate(640, 560);
    poly([[-150, -26], [150, -26], [140, 26], [-160, 26]], '#231a2e', { lw: 0 });
    txt(lang === 'el' ? 'ΕΠΕΙΣΟΔΙΟ 1' : 'EPISODE 1', 0, 0, 30, '#fff', { font: TVFONT, style: 'italic', weight: 900 });
    ctx.restore();
  }
}
function drawSubs(t) {
  const L = LINES.find(l => t >= l.a && t < l.b); if (!L) return;
  const s = lang === 'el' ? L.el : L.en;
  ctx.font = 'italic 700 30px "Noto Sans", sans-serif';
  const w = ctx.measureText(s).width + 56, a = Math.min(prog(t, L.a, L.a + .25), 1 - prog(t, L.b - .25, L.b));
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(15,12,18,.72)';
  ctx.beginPath(); ctx.roundRect(640 - w / 2, 628, w, 54, 12); ctx.fill();
  txt(s, 640, 656, 30, '#fffaf0', { font: TVFONT, style: 'italic' });
  ctx.restore();
}
function render(t) {
  SEED = 0; BOIL = Math.floor(t * 8);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < 4.3) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const m = mosqPath(t); ctx.save(); ctx.globalAlpha = .85; mosquito(m.x, m.y, m.s, t, m.f); ctx.restore();
  } else if (t < 23.9) {
    drawWorld(t);
    const fade = 1 - prog(t, 4.3, 6.2);
    if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
    if (t > 22.8) { const p = prog(t, 22.8, 23.9), s = lerp(1, 9, p * p); mosquito(lerp(1100, 640, p), lerp(200, 360, p), s, t, -1); }
  } else if (t < 24.25) mangaFlash(t);
  else titleCard(t);
  drawSubs(t);
  const out = prog(t, 32.4, 33.6);
  if (out > 0) { ctx.fillStyle = `rgba(0,0,0,${out})`; ctx.fillRect(0, 0, W, H); }
}

/* =========================================================
   SOUND (synthesized) + placeholder narrator (speechSynthesis)
   ========================================================= */
let AC = null, master = null, amb = null;
function ensureAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination);
    const mk = (type, f) => { const o = AC.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; };
    const gain = v => { const g = AC.createGain(); g.gain.value = v; return g; };
    const noiseSrc = () => { const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = AC.createBufferSource(); s.buffer = b; s.loop = true; s.start(); return s; };
    // mosquito: sawtooth with vibrato
    const mq = mk('sawtooth', 560), vib = mk('sine', 7), vg = gain(18); vib.connect(vg); vg.connect(mq.frequency);
    const mqF = AC.createBiquadFilter(); mqF.type = 'bandpass'; mqF.frequency.value = 900; mqF.Q.value = 1.2;
    const mqG = gain(0), mqP = AC.createStereoPanner(); mq.connect(mqF); mqF.connect(mqG); mqG.connect(mqP); mqP.connect(master);
    // cicadas: band-passed noise pulsed by an LFO
    const cn = noiseSrc(), cf = AC.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 5200; cf.Q.value = 6;
    const cAM = gain(0), lfo = mk('square', 34), lg = gain(.5); lfo.connect(lg); lg.connect(cAM.gain);
    const cG = gain(0); cn.connect(cf); cf.connect(cAM); cAM.connect(cG); cG.connect(master);
    // truck engine
    const en = mk('sawtooth', 48), ef = AC.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 260;
    const eG = gain(0), eP = AC.createStereoPanner(); en.connect(ef); ef.connect(eG); eG.connect(eP); eP.connect(master);
    amb = { mq, mqG, mqP, cG, eG, eP, en };
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'triangle', vol = .06, slide = 0) {
  if (!soundOn || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), n + dur);
  g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(vol, n + .005); g.gain.exponentialRampToValueAtTime(.0001, n + dur);
  o.connect(g); g.connect(master); o.start(n); o.stop(n + dur + .02);
}
const SFX = {
  hit: () => { tone(90, .5, 'square', .14, .5); tone(1800, .12, 'square', .05, .3); },
  clack: () => { tone(2400, .05, 'square', .12, .4); tone(900, .08, 'square', .1, .5); },
  jingle: () => [0, 4, 7, 12, 16].forEach((s, i) => setTimeout(() => tone(523.25 * 2 ** (s / 12), .25, 'square', .045), i * 90)),
};
const EVENTS = [[23.9, 'hit'], [25.45, 'clack'], [25.9, 'jingle']];
function updateAmbience(t) {
  if (!AC) return;
  const n = AC.currentTime, on = soundOn && playing, set = (p, v) => p.setTargetAtTime(on ? v : 0, n, .06);
  // mosquito: loud in the dark opening and in the close-up
  let mv = 0, pan = 0;
  if (t < 4.3) { const m = mosqPath(t); mv = .05 * (m.s / 1.9); pan = clamp((m.x - 640) / 520, -1, 1); }
  else if (t > 22.6 && t < 23.9) mv = .09 * prog(t, 22.6, 23.9);
  else if (t > 4.3 && t < 22.6) mv = .006;
  set(amb.mqG.gain, mv); amb.mqP.pan.setTargetAtTime(pan, n, .05);
  set(amb.cG.gain, (t > 4.3 && t < 23.9) ? .035 * prog(t, 4.3, 6) : 0);
  const tx = truckX(t), near = clamp(1 - Math.abs(tx - 600) / 1100);
  set(amb.eG.gain, (t > 16.6 && t < 23.4) ? .09 * near : 0);
  amb.eP.pan.setTargetAtTime(clamp((tx - 600) / 800, -1, 1), n, .05);
  amb.en.frequency.setTargetAtTime(48 + Math.sin(t * 9) * 4, n, .05);
}
// placeholder narrator
let voices = [];
const loadVoices = () => { voices = speechSynthesis.getVoices(); };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text) {
  if (!voOn || !soundOn || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('el'));
  if (v) u.voice = v; u.lang = 'el-GR'; u.rate = .88; u.pitch = .55; speechSynthesis.speak(u);
}
// recorded narrator clips (window.CLIPS, embedded by build.py from audio/scene01/NN.mp3) replace the TTS
let curClip = null;
const stopVO = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); if (curClip) { curClip.pause(); curClip = null; } };
function voiceLine(L, idx) {
  const src = (window.CLIPS || {})[`scene01/${String(idx + 1).padStart(2, '0')}`];
  if (!src) return say(L.el);
  if (!soundOn) return;
  stopVO(); curClip = new Audio(src); curClip.play().catch(() => {});
}
function tick(a, b) {
  if (soundOn && AC) for (const [et, s] of EVENTS) if (et > a && et <= b) SFX[s]();
  LINES.forEach((L, i) => { if (L.a > a && L.a <= b) voiceLine(L, i); });
}

/* =========================================================
   PLAYER
   ========================================================= */
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function updateUI() {
  $('play').textContent = playing ? '❚❚ Pause' : '▶ Play';
  $('big').hidden = playing || started;
  $('lang').textContent = lang === 'el' ? 'EN' : 'ΕΛ';
  $('snd').textContent = soundOn ? '🔊' : '🔇';
  $('vo').style.opacity = voOn ? 1 : .45;
}
function play() { ensureAudio(); if (T >= DUR) T = 0; playing = true; started = true; updateUI(); }
function pause() { playing = false; stopVO(); updateUI(); }
$('big').onclick = play;
$('play').onclick = () => playing ? pause() : play();
$('restart').onclick = () => { stopVO(); T = 0; play(); };
$('scrub').oninput = e => { stopVO(); T = +e.target.value; started = true; updateUI(); };
$('lang').onclick = () => { lang = lang === 'el' ? 'en' : 'el'; updateUI(); };
$('snd').onclick = () => { soundOn = !soundOn; if (soundOn) ensureAudio(); else stopVO(); updateUI(); };
$('vo').onclick = () => { voOn = !voOn; if (!voOn) stopVO(); updateUI(); };
$('fs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen?.(); };
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
function frame(now) {
  if (last == null) last = now;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) { const prev = T; T += dt; if (T >= DUR) { T = DUR; pause(); } tick(prev, T); }
  updateAmbience(T);
  render(started ? T : 26.8);
  $('scrub').value = T; $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`;
  requestAnimationFrame(frame);
}
window.renderAt = t => { started = true; T = t; updateUI(); render(t); };
updateUI(); requestAnimationFrame(frame);
</script>
